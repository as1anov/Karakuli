<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Karakuli</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #111111; --paper: #F4F3EF; --saffron: #F2C230; --saffron-hover: #E0AE14; --ink-2: #B5B3AC; --ink-line: #2E2E2C; --pad: clamp(20px, 4vw, 56px); --r-sm: 8px; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; background: var(--ink); color: var(--paper); font: 400 16px/1.55 'Google Sans', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--saffron); outline-offset: 3px; border-radius: 4px; }
header { display: flex; align-items: center; height: 68px; padding: 0 var(--pad); }
.brand { font-weight: 700; letter-spacing: 0.06em; text-decoration: none; font-size: 15px; }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px; padding: 40px var(--pad) 96px; max-width: 760px; }
/* a line that stops short: the path does not go on here */
.mark { display: flex; align-items: center; gap: 0; }
.mark i { display: block; height: 14px; width: 120px; background: var(--paper); }
.mark b { display: block; width: 14px; height: 14px; margin-left: 22px; background: var(--saffron); transform: rotate(45deg); }
h1 { margin: 0; font-weight: 700; font-size: clamp(40px, 7vw, 80px); line-height: 1.02; letter-spacing: -0.025em; }
p { margin: 0; max-width: 30em; color: var(--ink-2); font-size: 18px; }
.ways { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.ways a { display: inline-flex; align-items: center; height: 52px; padding: 0 22px; border-radius: var(--r-sm); text-decoration: none; font-weight: 500; }
.ways .main { background: var(--saffron); color: var(--ink); }
.ways .main:hover { background: var(--saffron-hover); }
.ways .alt { border: 1px solid var(--ink-line); }
.ways .alt:hover { border-color: var(--saffron); }
</style>
</head>
<body>
<header><a class="brand" href="/">KARAKULI</a></header>
<main>
  <div class="mark" aria-hidden="true"><i></i><b></b></div>
  <h1>This path leads nowhere.</h1>
  <p>The page you were looking for is not here. The pattern goes on from the start.</p>
  <div class="ways">
    <a class="main" href="/">Back to Karakuli</a>
    <a class="alt" href="/#shop">See the shop</a>
  </div>
</main>
</body>
</html>
